[project]
name = "cookie-tool-designer"
version = "0.1.0"
description = "Local artwork-to-3D-printable baking tool designer"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.38",
  "numpy>=1.26",
  "Pillow>=10.0",
  "opencv-python-headless>=4.10",
  "shapely>=2.0",
  "trimesh>=4.4",
  "mapbox-earcut>=1.0",
  "networkx>=3.3",
  "manifold3d>=3.0",
  "resvg-py==0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8.0"]
